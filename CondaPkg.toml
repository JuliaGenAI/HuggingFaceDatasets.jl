channels = ["conda-forge"]

[deps]
datasets = ">=5.1, <6"
numpy = ""
pillow = ""
# Exclude conda-forge's free-threaded (no-GIL) CPython builds, e.g. python 3.14 `cp314t`:
# PythonCall's free-threading support is experimental, and `datasets`' C extensions
# re-enable the GIL there anyway.
python-gil = ""

# Python 3.15 removed `co_lnotab`, which dill (≤ 0.4.1) needs to pickle functions, so `datasets`
# can't fingerprint transforms or send functions to `num_proc` workers there (dill#753).
[deps.python]
version = "<3.15"
