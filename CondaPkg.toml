channels = ["conda-forge"]

[deps]
datasets = ">=4.0, <6"
numpy = ""
pillow = ""
# Exclude conda-forge's free-threaded (no-GIL) CPython builds, e.g. python 3.14 `cp314t`:
# PythonCall's free-threading support is experimental, and `datasets`' C extensions
# re-enable the GIL there anyway.
python-gil = ""
